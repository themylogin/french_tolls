# Services for the toll booth route set pipeline. Driven by the Makefile;
# `docker compose up` on its own starts only the query servers.
#
# OSRM_TOLL_PATH and OSRM_OPTIMAL_PATH come from .env (see .env.example) and must
# be two different absolute paths outside this repository. Together the graphs are
# about 30 GB.

services:
  # Long-running query server for the untouched graph -- the road network as OSM
  # describes it, with no tariff in it. Every pipeline step queries this one.
  #
  # Service name and container name are deliberately identical so the Docker name
  # and the URL the builder calls are the same string.
  osrm-toll:
    container_name: osrm-toll
    image: ghcr.io/project-osrm/osrm-backend:26.8-debian
    # MLD must match the partition/customize preprocessing in `make setup_osrm`.
    # No -t: osrm-routed already defaults to hardware concurrency.
    # --max-table-size: the route search solves d(u,v) == d(u,b) + d(b,v) with
    # /table to find endpoint pairs whose fastest route provably crosses a
    # booth. The default of 100 locations is too small for that.
    command: osrm-routed --algorithm mld --max-table-size 2000 /osrm/france-latest.osrm
    volumes:
      - "${OSRM_TOLL_PATH}:/osrm"
    ports:
      # Localhost only. Consuming scripts that are not on this Compose network
      # reach the same instance here. Port 5000 stays with this graph because it
      # is the one everything already addressed before the toll weighting existed.
      - "127.0.0.1:5000:5000"
    # No restart policy on purpose: osrm-routed exits immediately when the graph
    # is missing, and a restart policy turns that into a silent crash loop.
    # The Makefile starts this service explicitly when it is needed.

  # Long-running query server for the toll-weighted graph -- the same network with
  # data/segment_weights.csv applied, so a tolled segment costs what its tariff
  # costs a driver. `apply_segment_weights` assembles the graph it serves.
  #
  # Nothing in the pipeline queries this one. It exists to be queried from
  # outside, and a route it returns is the cheapest in money-and-time rather than
  # the fastest.
  osrm-optimal:
    container_name: osrm-optimal
    image: ghcr.io/project-osrm/osrm-backend:26.8-debian
    command: osrm-routed --algorithm mld --max-table-size 2000 /osrm/france-latest.osrm
    volumes:
      - "${OSRM_OPTIMAL_PATH}:/osrm"
    ports:
      # The container port is 5000 in both servers; it is the published host port
      # that tells them apart.
      - "127.0.0.1:5001:5000"

  # One-shot osrm-extract / osrm-partition / osrm-customize against the untouched
  # graph. `./data` is mounted because the profile patch reads the extract there.
  osrm-tools:
    image: ghcr.io/project-osrm/osrm-backend:26.8-debian
    volumes:
      - "${OSRM_TOLL_PATH}:/osrm"
      - "./data:/data"
    profiles: ["tools"]

  # One-shot osrm-customize against the toll-weighted graph. A second tools
  # container rather than an argument to the first: the two mount different
  # graphs, and mounting both into one would make it possible to customize the
  # untouched graph by naming the wrong path.
  #
  # `./data` carries data/segment_weights.csv to --segment-speed-file.
  osrm-optimal-tools:
    image: ghcr.io/project-osrm/osrm-backend:26.8-debian
    volumes:
      - "${OSRM_OPTIMAL_PATH}:/osrm"
      - "./data:/data"
    profiles: ["tools"]

  # Our own image: the download, the PBF extraction, the route search, and the
  # segment weight derivation.
  # Deliberately no depends_on: steps 1 and 3 run the builder long before the
  # graph exists, and starting osrm-toll then would only crash it. Step 4
  # brings the server up explicitly and the script waits for it.
  #
  # It mounts the untouched graph, not the toll-weighted one: the profile patch
  # writes there, and every script that routes queries osrm-toll.
  builder:
    build: ./builder
    volumes:
      - "./data:/data"
      - "${OSRM_TOLL_PATH}:/osrm"
    # Exporting a variable on the host is not enough: a container sees only what
    # Compose declares for it. build_vinci_toll_booths needs the Ulys key and
    # build_vinci_prices needs the key and the tariff date, and this is the one
    # place that carries them across the boundary.
    environment:
      ULYS_SUBSCRIPTION_KEY: "${ULYS_SUBSCRIPTION_KEY:-}"
      ULYS_PASSAGE_DATE: "${ULYS_PASSAGE_DATE:-}"
    profiles: ["tools"]

  # The application that consumes what the pipeline publishes. It is not a
  # pipeline step: no build target invokes it, and it only ever reads what the
  # steps have already written.
  #
  # `./data` is mounted read-only. The four artefacts and the segment weight file
  # are inputs here, and a service that only reads them has no business being
  # able to write them. The cache goes to its own volume for the same reason:
  # `data/` holds the pipeline's tracked deliverables, not runtime state.
  #
  # Both routers are addressed by service name. The published host ports are for
  # inspection — on some hosts they refuse connections while the Compose network
  # answers — so nothing in this project routes through them.
  web:
    build: ./french_tolls
    container_name: french-tolls-web
    command: python3 -m french_tolls.web
    volumes:
      - "./data:/data:ro"
      - "cache:/cache"
    # No published port. The page and the API have to answer on one origin --
    # index.js fetches /api/ relative to wherever the page came from -- and that
    # origin is `nginx`, which proxies here over the Compose network. A second
    # public port would serve the API without the page, which is a URL that 404s
    # for anything a visitor wants.
    expose:
      - "8080"
    environment:
      OSRM_TOLL_URL: "${OSRM_TOLL_URL:-http://osrm-toll:5000}"
      OSRM_OPTIMAL_URL: "${OSRM_OPTIMAL_URL:-http://osrm-optimal:5000}"
      DATA_DIR: "/data"
      CACHE_DIR: "/cache"
      # autocomplete.py defaults this under /data, which is read-only here.
      AUTOCOMPLETE_CACHE: "/cache/autocomplete.sqlite"
      LOCATIONIQ_API_KEY: "${LOCATIONIQ_API_KEY:-}"
      # Refinement: the web service asks Google what it would actually drive and
      # spends the remaining waypoint budget correcting it. Both are optional --
      # without them every journey is answered unrefined.
      GOOGLE_DIRECTIONS_API_KEY: "${GOOGLE_DIRECTIONS_API_KEY:-}"
      GOOGLE_DIRECTIONS_MAX_REQUEST_PER_MONTH: "${GOOGLE_DIRECTIONS_MAX_REQUEST_PER_MONTH:-0}"
      # Where the three directions links point, so a link in a Telegram message
      # comes back here to be refined before it goes on to Google.
      PUBLIC_SITE_URL: "${PUBLIC_SITE_URL:-}"
      MAX_WAYPOINTS: "${MAX_WAYPOINTS:-9}"
      QUERY_BUDGET: "${QUERY_BUDGET:-500}"
      SNAP_REACH_M: "${SNAP_REACH_M:-1000}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    restart: unless-stopped
    # Behind a profile so that a plain `docker compose up` still starts the two
    # query services and nothing else, as the pipeline expects.
    profiles: ["app"]

  # The Telegram bot. Same image and same environment as the web service, minus
  # the published port: it polls Telegram and serves nothing.
  #
  # It is behind the same profile because it cannot run without a token, and a
  # pipeline-only checkout has no reason to hold one. Started by `up` it would
  # crash-loop and make the pipeline's own `up` useless.
  bot:
    build: ./french_tolls
    container_name: french-tolls-bot
    command: python3 -m french_tolls.bot
    volumes:
      - "./data:/data:ro"
      - "cache:/cache"
    environment:
      OSRM_TOLL_URL: "${OSRM_TOLL_URL:-http://osrm-toll:5000}"
      OSRM_OPTIMAL_URL: "${OSRM_OPTIMAL_URL:-http://osrm-optimal:5000}"
      DATA_DIR: "/data"
      CACHE_DIR: "/cache"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      MAX_WAYPOINTS: "${MAX_WAYPOINTS:-9}"
      QUERY_BUDGET: "${QUERY_BUDGET:-500}"
      SNAP_REACH_M: "${SNAP_REACH_M:-1000}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    restart: unless-stopped
    profiles: ["app"]

  # The front end: the page, and the one public entry point of this project.
  #
  # Built from its own image under `www/` rather than from the application's. A
  # stylesheet has no business rebuilding a Python image, and serving three
  # static files has no business installing aiohttp.
  #
  # It reaches the application at its service name over the Compose network, as
  # every other consumer in this project does.
  nginx:
    build: ./www
    container_name: french-tolls-nginx
    ports:
      - "127.0.0.1:${FRENCH_TOLLS_PORT:-8080}:80"
    # The page is served whether or not the API is up: a visitor then gets the
    # page and an error from Calculate, which is more use than a refused
    # connection. So this waits for `web` to start, not to be healthy.
    depends_on:
      - web
    restart: unless-stopped
    profiles: ["app"]

  # One-shot run of the unit test suite. Its own profile rather than `app`: it
  # is a run that ends, not a service, and `--profile app up` must not start it.
  #
  # It mounts nothing and is given nothing. The suite answers its own routing
  # questions from a graph written in the test and builds its own booth table,
  # so it reaches neither router and reads no artefact. A test runner carrying
  # a dependency its tests do not use only makes the suite unrunnable on a
  # checkout that has no graphs.
  #
  # It still runs from the application's own image, so what is tested is the
  # code as it ships rather than a copy assembled by a test harness.
  tests:
    build: ./french_tolls
    command: python3 -m pytest -q -p no:cacheprovider /app/french_tolls/tests
    profiles: ["test"]

  # The paid evaluation: it asks this project for a route, asks Google to drive
  # it through the waypoints this project emitted, and reports how faithfully
  # Google followed.
  #
  # Its own profile, so neither `docker compose up` nor `--profile app up`
  # starts it. This is the one service in the project that spends money, and it
  # runs when it is named and at no other time.
  #
  # ./data is writable because what it buys is kept there. It reaches the
  # application and the routers by service name, as everything else does.
  evaluation:
    build: ./evaluation
    volumes:
      - "./data:/data"
      # The application's package, read-only, for the corridor measure the
      # refinement and this report have to agree on. Mounted rather than copied
      # so there is exactly one implementation of it.
      - "./french_tolls:/app/french_tolls:ro"
    environment:
      GOOGLE_DIRECTIONS_API_KEY: "${GOOGLE_DIRECTIONS_API_KEY:-}"
      FRENCH_TOLLS_URL: "${FRENCH_TOLLS_URL:-http://web:8080}"
      OSRM_TOLL_URL: "${OSRM_TOLL_URL:-http://osrm-toll:5000}"
      OSRM_OPTIMAL_URL: "${OSRM_OPTIMAL_URL:-http://osrm-optimal:5000}"
      DATA_DIR: "/data"
      PUBLIC_SITE_URL: "${PUBLIC_SITE_URL:-https://french-tolls.undiscoveredlatitudes.com}"
    profiles: ["evaluation"]

# Cached answers and the autocomplete database. A named volume rather than a
# path under `data/`: the cache is runtime state that grows, and `data/` holds
# tracked deliverables the application mounts read-only.
volumes:
  cache:
