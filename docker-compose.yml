services:
  osrm-toll:
    image: ghcr.io/project-osrm/osrm-backend:26.8-debian
    # --max-matching-size is necessary to match Google Maps routes across OSM graph.
    command: osrm-routed --algorithm mld --max-matching-size 10000 /osrm/france-latest.osrm
    volumes:
      - "${OSRM_TOLL_PATH}:/osrm"
    restart: always

  osrm-optimal:
    image: ghcr.io/project-osrm/osrm-backend:26.8-debian
    command: osrm-routed --algorithm mld /osrm/france-latest.osrm
    volumes:
      - "${OSRM_OPTIMAL_PATH}:/osrm"
    restart: always

  nginx:
    build: ./www
    depends_on:
      - web
    restart: unless-stopped
    profiles: ["app"]

  web:
    build: .
    command: python3 -m french_tolls.web
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - "./data:/data:ro"
      - "cache:/cache"
    env_file: .env
    restart: unless-stopped
    profiles: ["app"]

  bot:
    build: .
    command: python3 -m french_tolls.bot
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - "./data:/data:ro"
      - "cache:/cache"
    env_file: .env
    restart: unless-stopped
    profiles: ["app"]

  migrate:
    build: .
    command: alembic upgrade head
    volumes:
      - "cache:/cache"
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    restart: "no"
    profiles: ["app", "record"]

  # Tools

  osrm-toll-tools:
    image: ghcr.io/project-osrm/osrm-backend:26.8-debian
    volumes:
      - "${OSRM_TOLL_PATH}:/osrm"
      - "./data:/data"
    profiles: ["tools"]

  osrm-optimal-tools:
    image: ghcr.io/project-osrm/osrm-backend:26.8-debian
    volumes:
      - "${OSRM_OPTIMAL_PATH}:/osrm"
      - "./data:/data"
    profiles: ["tools"]

  builder:
    build: ./builder
    volumes:
      - "./data:/data"
      - "${OSRM_TOLL_PATH}:/osrm"
    environment:
      ULYS_SUBSCRIPTION_KEY: "${ULYS_SUBSCRIPTION_KEY:-}"
      ULYS_PASSAGE_DATE: "${ULYS_PASSAGE_DATE:-}"
    profiles: ["tools"]

  # Developer tools

  tests:
    build: .
    command: python3 -m pytest -q -p no:cacheprovider /app/french_tolls/tests
    profiles: ["test"]

  integration:
    build: .
    command: python3 -m pytest -q -p no:cacheprovider /app/french_tolls/integration
    volumes:
      - "./data:/data:ro"
    tmpfs:
      - /cache
    env_file: .env
    environment:
      # The suite spends nothing by construction. The flow posts to the replay
      # server the suite starts, so a real key in .env buys nothing, and the
      # chat is built on a token of the suite's own.
      GOOGLE_ROUTES_ENDPOINT: "http://127.0.0.1:8099/directions/v2:computeRoutes"
      TELEGRAM_BOT_TOKEN: ""
    profiles: ["test"]

  recorder:
    build: .
    command: python3 -m french_tolls.integration.record
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - "./data:/data:ro"
      - "cache:/cache"
      - "./french_tolls/integration/cassettes:/app/french_tolls/integration/cassettes"
    env_file: .env
    profiles: ["record"]

  evaluation:
    build:
      context: .
      dockerfile: evaluation/Dockerfile
    volumes:
      - "./data:/data"
      - "./french_tolls:/app/french_tolls:ro"
    env_file: .env
    profiles: ["evaluation"]

volumes:
  cache:
