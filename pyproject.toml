[project]
name = "french-tolls"
version = "0.0.0"
description = "Cheapest-by-toll routes across France, as a web service and a Telegram bot"
requires-python = ">=3.11"

dependencies = [
    "aiohttp",
    "aiosqlite",
    "alembic",
    "polyline",
    "pyproj",
    "pytest",
    "python-telegram-bot~=21.0",
    "PyYAML",
    "shapely",
    "SQLAlchemy>=2",
]
