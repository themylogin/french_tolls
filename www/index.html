    <div class="controls">
        <div id="collapse-control">
            <i class="bi bi-chevron-bar-right myuncollapse"></i>
            <i class="bi bi-chevron-bar-left mycollapse"></i>
        </div>
        <div class="content">
            <div class="mb-3">
                <input type="text" class="form-control" id="from" placeholder="From">
            </div>
            <div class="mb-3">
                <input type="text" class="form-control" id="to" placeholder="To">
            </div>
            <div class="mb-3">
                <button type="button" class="btn btn-primary" id="calculate">Calculate</button>
            </div>
            <div class="spinner-border" role="status" id="calculating">
                <span class="visually-hidden">Calculating...</span>
            </div>
            <div id="routes"></div>
            <div class="alert alert-danger" id="error">
                Error calculating this route. I am very sorry for that 😞
            </div>
            <div style="margin-top: 20px; font-size: 0.9rem;">
                <a href="https://t.me/french_toll_roads_bot">💬 Telegram Bot</a><br>
                <a href="https://buymeacoffee.com/themylogin" target="_blank">👍 Send me a tip</a> (or <a href="https://paypal.me/themyloginspain" target="_blank">PayPal</a>)
            </div>
        </div>
    </div>
    <div id="map"></div>

    <!-- prettier-ignore -->
