# The front end's server, and the one public entry point of this project.
#
# It answers two things on one origin: the page, from files baked into this
# image, and /api/, proxied to the aiohttp application. One origin is not a
# preference -- index.js fetches `/api/calculate` and `/api/autocomplete` as
# paths relative to wherever the page was loaded from, so anything that served
# the page from a different host would need a CORS policy and a preflight on
# every calculation to say what this file says once.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long enough for the application's worst case with room to spare. A route
    # search is bounded at 500 routing requests of 2-11 ms each, so an answer
    # arrives well inside a second; the first request after a restart also reads
    # 12 MB of YAML before it can answer at all.
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;

    # Docker's embedded DNS. Naming it is what lets the upstream below be a
    # variable, and `valid` is how long an answer is held before being asked
    # again.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # `web` is the Compose service name, resolved on the Compose network. That
    # is how every consumer in this project reaches a service it depends on: the
    # published host ports are for inspection, and on some hosts they refuse
    # connections while the network answers.
    #
    # The upstream is held in a variable on purpose. Written literally, nginx
    # resolves the name when it reads this file, which means `nginx -t` fails at
    # image build time when no such host exists, the server refuses to start if
    # it comes up before `web`, and -- worst of the three, because it is silent
    # -- it pins whatever address `web` had at startup and goes on using it
    # after `web` is recreated with another. A variable defers resolution to
    # request time and re-resolves on the TTL above.
    #
    # $request_uri is spelled out because a variable upstream carries no URI
    # part for nginx to reason about, so the original path and query have to be
    # passed explicitly rather than inferred.
    # /go/ is the redirect the three directions links point at. It belongs to
    # the application for the same reason /api/ does, and the page is served
    # from the same origin so a link in a Telegram message resolves here.
    location ~ ^/(api|go)/ {
        set $api_upstream http://web:8080;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html is re-fetched every time: it is 4 KB, and it carries the query
    # strings that version the other two.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # index.js and style.css are already cache-busted by the `?2` and `?3` the
    # page appends to them, so a long life here costs nothing and an edit still
    # reaches a browser as soon as the markup names a new version.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000";
    }

    # No single-page fallback. This is not an application with client-side
    # routes: a catch-all to index.html would answer a mistyped stylesheet path
    # with HTML, which the browser then fails to parse as CSS and reports as a
    # style that did not load rather than as a file that is not there.
    location / {
        try_files $uri $uri/ =404;
    }
}
